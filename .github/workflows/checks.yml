name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-vm-modules checks/spaces-glow.cjs
      - run: node --experimental-vm-modules --test checks/*.test.mjs
